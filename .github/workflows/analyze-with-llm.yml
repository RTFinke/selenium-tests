name: Analyze with LLM
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Siz3r Model Tests"]
    types: [completed]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download test results
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: selenium.yml
        name: siz3r-test-results
        path: test_results/
        search_artifacts: true
        if_no_artifact_found: fail

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Convert structure
      run: |
        mkdir -p images
        for test_dir in test_results/test_*; do
          if [ -d "$test_dir" ]; then
            test_name=$(basename "$test_dir")
            target_dir="images/$test_name"
            mkdir -p "$target_dir"
            find "$test_dir/garment" -type f -exec cp {} "$target_dir/garment.jpg" \; 2>/dev/null || true
            find "$test_dir/result" -type f -exec cp {} "$target_dir/result.png" \; 2>/dev/null || true
          fi
        done

    - name: Run analysis
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_CONCURRENCY: 1
        OPENAI_DELAY_MS: 750
        OPENAI_MIN_RETRY_DELAY_MS: 1000
        OPENAI_RATE_LIMIT_JITTER_MS: 250
        OPENAI_TIMEOUT_MS: 120000
        OPENAI_PASS_SCORE_THRESHOLD: 85
        OPENAI_MAX_MINOR_LABELS_FOR_PASS: 1
      run: node analyze_quality.js

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: llm-quality-analysis
        path: |
          outputs/
          test_results/
