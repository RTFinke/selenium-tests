name: Analyze with LLM
run-name: "Judge generation: ${{ inputs.run_url || github.event.workflow_run.html_url }}"

on:
  workflow_dispatch:
    inputs:
      run_url:
        description: Paste the link to the generation run you want to judge
        required: true
        type: string
  workflow_run:
    workflows: ["Siz3r Model Tests"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Automatic workflow_run jobs use this evaluator from the default branch.
      # Generation artifacts are pinned to the triggering run below.
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check API key configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e 'if (!process.env.OPENAI_API_KEY?.trim()) { console.error("Set the OPENAI_API_KEY repository secret under Settings > Secrets and variables > Actions."); process.exit(1); }'

      - name: Install dependencies
        run: npm ci

      - name: Check assessment code
        run: npm test

      - name: Download the selected generation
        uses: actions/github-script@v7
        env:
          ANALYSIS_RUN_URL: ${{ inputs.run_url }}
        with:
          script: |
            const { downloadArtifacts } = require('./.github/scripts/analysis-artifacts.cjs');
            await downloadArtifacts({ github, context, core });

      - name: Run assessment
        env:
          ANALYSIS_REPORT_MODE: review
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
          OPENAI_CONCURRENCY: "1"
          OPENAI_DELAY_MS: "750"
          OPENAI_MIN_RETRY_DELAY_MS: "1000"
          OPENAI_TIMEOUT_MS: "120000"
          OPENAI_PASS_SCORE_THRESHOLD: ${{ vars.OPENAI_PASS_SCORE_THRESHOLD || '80' }}
          OPENAI_MAX_MINOR_LABELS_FOR_PASS: "2"
        run: npm run analyze

      - name: Upload report and source images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-quality-analysis
          if-no-files-found: warn
          retention-days: 30
          path: |
            outputs/
            test_results/
