name: Analyze with LLM
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Siz3r Model Tests"]
    types: [completed]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download triggered test results
      if: ${{ github.event_name == 'workflow_run' }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: selenium.yml
        run_id: ${{ github.event.workflow_run.id }}
        name: siz3r-test-results
        path: test_results/
        if_no_artifact_found: fail

    - name: Download latest test results
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: selenium.yml
        name: siz3r-test-results
        path: test_results/
        search_artifacts: true
        if_no_artifact_found: fail

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Convert structure
      run: |
        mkdir -p images
        copy_first_image() {
          local source_dir="$1"
          local target_dir="$2"
          local base_name="$3"
          local src
          local ext

          if [ ! -d "$source_dir" ]; then
            return 0
          fi

          src=$(find "$source_dir" -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.avif' \) | head -n 1)
          if [ -z "$src" ]; then
            return 0
          fi

          ext="${src##*.}"
          cp "$src" "$target_dir/${base_name}.${ext}"
        }

        for run_root in test_results/test_results_upper test_results/test_results_lower test_results_upper test_results_lower; do
          if [ -d "$run_root" ]; then
            run_name=$(basename "$run_root")
            run_prefix=${run_name#test_results_}
            for test_dir in "$run_root"/test_*; do
              if [ -d "$test_dir" ]; then
                test_name=$(basename "$test_dir")
                target_dir="images/${run_prefix}_${test_name}"
                mkdir -p "$target_dir"
                copy_first_image "$test_dir/model" "$target_dir" "model"
                copy_first_image "$test_dir/garment" "$target_dir" "garment"
                copy_first_image "$test_dir/result" "$target_dir" "result"
              fi
            done
          fi
        done

    - name: Run analysis
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_CONCURRENCY: 1
        OPENAI_DELAY_MS: 750
        OPENAI_MIN_RETRY_DELAY_MS: 1000
        OPENAI_RATE_LIMIT_JITTER_MS: 250
        OPENAI_TIMEOUT_MS: 120000
        OPENAI_PASS_SCORE_THRESHOLD: 80
        OPENAI_MAX_MINOR_LABELS_FOR_PASS: 2
      run: node analyze_quality.js

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: llm-quality-analysis
        path: |
          outputs/
          test_results/
