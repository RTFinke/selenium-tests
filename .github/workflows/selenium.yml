name: Siz3r Model Tests

on:
  workflow_dispatch:

jobs:
  test-all-models:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install selenium

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        env:
          HEADLESS: "true"
          PYTHON_BIN: python
          SELENIUM_COMPOSE_FILE: docker-compose.cloud.yml
          SELENIUM_GRID_URL: http://localhost:4444
          TEST_PAIRING_MODE: all
          TEST_PAIRING_SEED: stable-v1
          FAIL_ON_TEST_FAILURES: "false"
        run: |
          chmod +x run_selenium.sh
          ./run_selenium.sh

      - name: Build review gallery input
        if: always()
        run: |
          mkdir -p test_results
          for dir in test_results_upper test_results_lower test_results_full; do
            if [ -d "$dir" ]; then
              find "$dir" -mindepth 1 -maxdepth 1 -type d -name 'test_*' -exec cp -R {} test_results/ \;
            fi
          done

      - name: Generate review gallery
        if: always()
        env:
          ANALYZE_SOURCE_DIR: test_results
          ANALYSIS_OUTPUT_DIR: outputs
          ANALYSIS_REPORT_MODE: gallery
        run: node analyze_quality.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siz3r-test-results
          if-no-files-found: warn
          retention-days: 30
          path: |
            test_results/
            test_results_upper/
            test_results_lower/
            test_results_full/
            test_results_summary.json
            selenium-grid-logs.txt
            outputs/index.html
