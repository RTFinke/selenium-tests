name: Siz3r Model Tests
on:
  workflow_dispatch:
jobs:
  test-all-models:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install selenium
    
    - name: Start Selenium Grid
      run: |
        docker compose -f docker-compose.cloud.yml up -d
        sleep 20
    
    - name: Wait for Grid
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:4444/status; do sleep 2; done'
    
    - name: Run tests
      env:
        SELENIUM_GRID_URL: http://localhost:4444
        HEADLESS: true
        MAX_TESTS: ""
      run: python test_business.py
    
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: siz3r-test-results
        path: test_results/
        retention-days: 30
    
    - name: Stop Grid
      if: always()
      run: docker compose -f docker-compose.cloud.yml down